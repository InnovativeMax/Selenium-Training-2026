<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management Dashboard</title>
</head>

<body>

<h1>Business Management Dashboard</h1>

<!-- Navigation Links -->
<nav id="main-navigation">

    <a href="master.html">Master</a>
    <a href="stocks.html">Stocks</a>
    <a href="inventory.html">Inventory</a>
    <a href="bills.html">Bills</a>
    <a href="reports.html">Reports</a>

</nav>

<hr>

<!-- Dashboard -->
<div id="dashboard">

    <h2>Dashboard</h2>

    <!-- Parent container for 4 checkboxes -->
    <div id="dashboard-options">

        <label>
            <input type="checkbox" name="dashboardOption" value="sales">
            Sales
        </label>

        <label>
            <input type="checkbox" name="dashboardOption" value="purchase">
            Purchase
        </label>

        <label>
            <input type="checkbox" name="dashboardOption" value="profit">
            Profit
        </label>

        <label>
            <input type="checkbox" name="dashboardOption" value="stock">
            Stock
        </label>

    </div>

    <br>

    <!-- Parent container for True / False radio buttons -->
    <div id="status-options">

        <label>
            <input type="radio" name="status" value="true">
            True
        </label>

        <label>
            <input type="radio" name="status" value="false">
            False
        </label>

    </div>

</div>

</body>
</html>
